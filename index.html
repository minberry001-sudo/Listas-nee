<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis listas">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Organiza tus carpetas y listas desde el móvil.">
<title>Mis listas</title>
<style>
:root {
  color-scheme: dark;
  --bg:#101116; --panel:#191b23; --panel-2:#20232d;
  --line:#303440; --text:#f4f5f8; --muted:#969baa;
  --accent:#8585ff; --accent-2:#6666e8; --danger:#ff777f;
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); }
body { font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overscroll-behavior-y:none; }
button,input { font:inherit; }
#listApp {
  min-height:100vh; min-height:100dvh; padding:26px 18px 36px;
  background:
    radial-gradient(ellipse at 85% -10%,rgba(104,104,235,.14),transparent 36%),
    radial-gradient(ellipse at -10% 35%,rgba(73,112,180,.08),transparent 32%),
    var(--bg);
}
#appContent { width:min(100%,980px); margin:0 auto; }
#listApp button {
  border:1px solid var(--line); background:#242732; color:var(--text);
  padding:10px 14px; border-radius:12px; font-size:13px; font-weight:650;
  cursor:pointer; transition:background .18s,border-color .18s,transform .18s;
}
#listApp button:hover { background:#303443; border-color:#555b70; }
#listApp button:active { transform:scale(.98); }
#listApp button.primary {
  background:linear-gradient(135deg,#7777f4,#5555c9); border-color:#8585ff;
  box-shadow:0 7px 20px rgba(91,91,220,.22);
}
#listApp button.primary:hover { background:linear-gradient(135deg,#8989ff,#6262df); }
#listApp button.danger { color:#ff9298; border-color:rgba(255,119,127,.25); background:rgba(255,119,127,.08); }
#listApp .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:8px 0 22px; }
#listApp h2 { margin:0; font-size:clamp(20px,4vw,25px); letter-spacing:-.6px; font-weight:760; }
#listApp .muted { color:var(--muted); font-size:12px; line-height:1.5; }
#listApp .eyebrow { color:#a5a5ff; text-transform:uppercase; letter-spacing:1.5px; font-size:10px; font-weight:800; margin-bottom:7px; }
#listApp .folders { display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:13px; }
#listApp .folder {
  position:relative; overflow:hidden; min-height:132px; padding:17px;
  border:1px solid var(--line); border-radius:17px; cursor:pointer;
  background:linear-gradient(145deg,rgba(38,41,53,.98),rgba(25,27,35,.98));
  box-shadow:0 8px 24px rgba(0,0,0,.13); transition:transform .2s,border-color .2s,box-shadow .2s;
}
#listApp .folder:after { content:""; position:absolute; width:100px; height:100px; right:-38px; top:-42px; border-radius:50%; background:rgba(130,130,255,.09); }
#listApp .folder:hover { transform:translateY(-3px); border-color:#6868c8; box-shadow:0 12px 28px rgba(0,0,0,.22); }
#listApp .folderIcon { font-size:27px; margin-bottom:13px; }
#listApp .folderName { font-size:14px; font-weight:750; overflow-wrap:anywhere; margin-bottom:5px; }
#listApp .listButtons { display:grid; gap:10px; }
#listApp .listButton {
  width:100%; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 16px; background:linear-gradient(120deg,#20232d,#191b23); border-radius:14px;
}
#listApp .listButton .listTitle { font-weight:700; font-size:14px; }
#listApp .listButton .listMeta { display:block; color:var(--muted); font-size:11px; margin-top:4px; font-weight:450; }
#listApp .listArrow { color:#9292ff; font-size:20px; }
#listApp .back { margin-bottom:18px; }
#listApp .tableWrap { overflow:auto; border:1px solid var(--line); border-radius:15px; margin-top:14px; background:#171920; -webkit-overflow-scrolling:touch; box-shadow:0 10px 30px rgba(0,0,0,.14); }
#listApp table { border-collapse:separate; border-spacing:0; table-layout:fixed; font-size:12px; }
#listApp th {
  background:#292d3a; color:#dfe1ed; padding:12px 7px; border-right:1px solid #3b4050;
  border-bottom:1px solid #3b4050; text-align:center; font-size:11px; line-height:1.25;
  overflow-wrap:anywhere; word-break:break-word; font-weight:750;
}
#listApp th:first-child,#listApp td:first-child { width:42px; min-width:42px; max-width:42px; }
#listApp th:nth-child(2),#listApp td:nth-child(2) { width:190px; min-width:190px; max-width:190px; }
#listApp th:last-child { border-right:0; }
#listApp th[data-action="rename-column"] { cursor:pointer; }
#listApp th[data-action="rename-column"]:active { background:#42475b; }
#listApp td { background:#1b1e26; border-right:1px solid #303440; border-bottom:1px solid #303440; padding:5px 4px; text-align:center; }
#listApp tbody tr:last-child td { border-bottom:0; }
#listApp tbody tr:nth-child(even) td { background:#1e212a; }
#listApp td:last-child { border-right:0; }
#listApp td.nameCell { text-align:left; vertical-align:middle; padding:7px 9px; }
#listApp .rowName,#listApp .numberCell {
  display:block; width:100%; min-width:0; color:var(--text); border-radius:7px;
  cursor:text; overflow-wrap:anywhere; white-space:pre-wrap; padding:6px 5px; line-height:1.35;
  outline:none; -webkit-user-modify:read-write-plaintext-only;
}
#listApp th[contenteditable="true"] { outline:none; cursor:text; }
#listApp [contenteditable="true"]:focus { background:rgba(133,133,255,.07); }
#listApp tr.long-pressing,
#listApp tr.long-pressing * {
  -webkit-user-select:none !important; user-select:none !important;
  -webkit-touch-callout:none !important;
}
#listApp .rowName { text-align:left; font-size:12px; font-weight:600; }
#listApp .numberCell { text-align:center; font-size:13px; font-variant-numeric:tabular-nums; }
#listApp .rowName:hover,#listApp .numberCell:hover { background:rgba(135,135,255,.09); }
#listApp tr.done .rowName,#listApp tr.done .numberCell { text-decoration:line-through; color:#858995; }
#listApp input[type=checkbox] { width:18px; height:18px; accent-color:#8585ff; cursor:pointer; }
#listApp .empty { padding:35px 14px; text-align:center; color:var(--muted); font-size:13px; border:1px dashed #383d4b; border-radius:15px; margin-top:15px; }
#listApp .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:17px; }
#listApp .actions button { flex:1 1 auto; }
#listApp .hint { margin-top:10px; color:#828797; font-size:11px; }
#listApp .modalBackdrop {
  position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center;
  padding:20px; background:rgba(5,6,10,.72); backdrop-filter:blur(8px);
}
#listApp .modal {
  width:min(100%,360px); padding:22px; border:1px solid #414657; border-radius:20px;
  background:linear-gradient(145deg,#252936,#191b23); box-shadow:0 25px 80px rgba(0,0,0,.55);
  animation:pop .18s ease-out;
}
#listApp .modalIcon { width:42px; height:42px; display:grid; place-items:center; border-radius:13px; background:rgba(255,119,127,.12); font-size:20px; margin-bottom:14px; }
#listApp .modal h3 { margin:0 0 7px; font-size:18px; }
#listApp .modal p { margin:0; color:var(--muted); font-size:13px; line-height:1.5; }
#listApp .modalActions { display:flex; justify-content:flex-end; gap:8px; margin-top:22px; }
#listApp .modalActions button { min-width:95px; }
@keyframes pop { from { opacity:0; transform:translateY(8px) scale(.98); } to { opacity:1; transform:none; } }
@media(max-width:600px) {
  #listApp { padding:calc(env(safe-area-inset-top) + 20px) 12px calc(20px + env(safe-area-inset-bottom)); }
  #listApp .top { align-items:center; margin-bottom:18px; }
  #listApp h2 { font-size:19px; }
  #listApp button { padding:9px 11px; font-size:12px; }
  #listApp .folders { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  #listApp .folder { min-height:120px; padding:14px; }
  #listApp th { padding:10px 5px; font-size:10px; }
  #listApp td { padding:4px 3px; }
  #listApp th:nth-child(2),#listApp td:nth-child(2) { width:165px; min-width:165px; max-width:165px; }
  #listApp .actions { gap:7px; }
}
</style>
</head>
<body>
<div id="listApp"><div id="appContent"></div></div>
<script>
(function(){
  const root=document.getElementById("listApp");
  const content=root.querySelector("#appContent");
  const KEY="miGestorListasV1";
  let data={folders:[]};
  try {
    const stored=JSON.parse(localStorage.getItem(KEY));
    if(stored && Array.isArray(stored.folders)) data=stored;
  } catch(e) {}
  let currentFolder=null, currentList=null, longPressTimer=null, longPressTriggered=false, activeRow=null;

  function save(){ localStorage.setItem(KEY,JSON.stringify(data)); }
  function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function date(){ return new Date().toLocaleDateString(); }
  function id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function getFolder(){ return data.folders.find(f=>f.id===currentFolder); }
  function getList(){ const f=getFolder(); return f&&f.lists.find(l=>l.id===currentList); }

  function home(){
    currentFolder=null; currentList=null;
    content.innerHTML=`
      <div class="top">
        <div><div class="eyebrow">Tu espacio personal</div><h2>Mis carpetas</h2><div class="muted">Todo organizado en un solo lugar</div></div>
        <button class="primary" data-action="new-folder">＋ Carpeta</button>
      </div>
      <div class="folders">
        ${data.folders.map(f=>`
          <div class="folder" data-action="open-folder" data-id="${esc(f.id)}">
            <div class="folderIcon">📁</div><div class="folderName">${esc(f.name)}</div>
            <div class="muted">${f.lists.length} ${f.lists.length===1?"lista":"listas"} · ${esc(f.created)}</div>
          </div>`).join("")}
      </div>
      ${data.folders.length?"":'<div class="empty">✨<br><br>Todavía no tienes carpetas.<br>Crea tu primera carpeta para empezar.</div>'}`;
  }

  function folderPage(){
    const f=getFolder(); if(!f){home();return;}
    content.innerHTML=`
      <button class="back" data-action="home">← Todas las carpetas</button>
      <div class="top">
        <div><div class="eyebrow">Carpeta</div><h2>📁 ${esc(f.name)}</h2><div class="muted">Creada el ${esc(f.created)}</div></div>
        <button class="primary" data-action="new-list">＋ Lista</button>
      </div>
      <div class="listButtons">
        ${f.lists.map(l=>`
          <button class="listButton" data-action="open-list" data-id="${esc(l.id)}">
            <span><span class="listTitle">📋 ${esc(l.name)}</span><span class="listMeta">${l.rows.length} registros · ${esc(l.created)}</span></span><span class="listArrow">›</span>
          </button>`).join("")}
      </div>
      ${f.lists.length?"":'<div class="empty">Esta carpeta todavía no tiene listas.<br>Añade una para empezar.</div>'}
      <div class="actions"><button data-action="rename-folder">✎ Renombrar carpeta</button><button class="danger" data-action="delete-folder">Eliminar carpeta</button></div>`;
  }

  function listPage(){
    const l=getList(); if(!l){folderPage();return;}
    const tableWidth=42+190+(l.columns.length*76);
    content.innerHTML=`
      <button class="back" data-action="folder">← Volver a ${esc(getFolder().name)}</button>
      <div class="top">
        <div><div class="eyebrow">Tu lista</div><h2>${esc(l.name)}</h2><div class="muted">Creada el ${esc(l.created)}</div></div>
        <button class="primary" data-action="add-row">＋ Añadir</button>
      </div>
      <div class="muted">Escribe directamente en cualquier celda; los cambios se guardan automáticamente.</div>
      <div class="tableWrap">
        <table style="width:100%;min-width:${tableWidth}px">
          <thead><tr><th>✓</th><th>Nombre</th>
            ${l.columns.map((c,j)=>`<th contenteditable="true" spellcheck="false" data-edit="column" data-col="${j}" title="Editar directamente">${esc(c)}</th>`).join("")}
          </tr></thead>
          <tbody>
            ${l.rows.map((r,i)=>`
              <tr class="${r.done?"done":""}" data-row="${i}">
                <td><input type="checkbox" aria-label="Marcar como completado" data-action="check" data-index="${i}" ${r.done?"checked":""}></td>
                <td class="nameCell"><div class="rowName" contenteditable="true" spellcheck="false" data-edit="name" data-index="${i}">${esc(r.name)}</div></td>
                ${l.columns.map((c,j)=>`<td><div class="numberCell" contenteditable="true" spellcheck="false" data-edit="value" data-index="${i}" data-col="${j}">${esc(r.values[j]??"")}</div></td>`).join("")}
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
      <div class="muted" style="margin-top:10px">${l.rows.length} registros · ${l.columns.length} columnas</div>
      <div class="hint">Mantén pulsada una fila para eliminarla. Pulsa Enter para terminar de editar una celda.</div>
      <div class="actions">
        <button data-action="add-row">＋ Añadir fila</button>
        <button data-action="rename-list">Renombrar lista</button><button class="danger" data-action="delete-list">Eliminar lista</button>
      </div>`;
  }

  function newFolder(){
    const name=prompt("Nombre de la carpeta:");
    if(!name||!name.trim())return;
    data.folders.push({id:id(),name:name.trim(),created:date(),lists:[]}); save(); home();
  }
  function newList(){
    const name=prompt("Nombre de la lista:"); if(!name||!name.trim())return;
    const amount=Number(prompt("¿Cuántas columnas numéricas quieres?","2"));
    if(!Number.isInteger(amount)||amount<1||amount>20){alert("Elige entre 1 y 20 columnas.");return;}
    const columns=[];
    for(let i=0;i<amount;i++){
      const n=prompt("Nombre de la columna "+(i+1)+":","Columna "+(i+1));
      columns.push(n&&n.trim()?n.trim():"Columna "+(i+1));
    }
    getFolder().lists.push({id:id(),name:name.trim(),created:date(),columns,rows:[]}); save(); folderPage();
  }
  function addRow(){
    const l=getList(); if(!l)return;
    l.rows.push({id:id(),name:"Nuevo elemento",values:l.columns.map(() => ""),done:false});
    save(); listPage();
  }
  function showDeleteModal(index){
    const l=getList(); if(!l||!l.rows[index])return;
    const rowName=l.rows[index].name||"esta fila";
    const backdrop=document.createElement("div");
    backdrop.className="modalBackdrop";
    backdrop.innerHTML=`
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
        <div class="modalIcon">🗑️</div>
        <h3 id="deleteTitle">¿Quieres eliminar esta celda?</h3>
        <p>Se eliminará la fila «${esc(rowName)}» y todos sus valores. Esta acción no se puede deshacer.</p>
        <div class="modalActions"><button data-modal="cancel">Cancelar</button><button class="danger" data-modal="confirm">Eliminar</button></div>
      </div>`;
    root.appendChild(backdrop);
    backdrop.addEventListener("click",e=>{
      const action=e.target.closest("[data-modal]")?.dataset.modal;
      if(action==="cancel"||e.target===backdrop) backdrop.remove();
      if(action==="confirm"){
        const current=getList();
        if(current&&current.rows[index]){current.rows.splice(index,1);save();}
        backdrop.remove(); listPage();
      }
    });
  }

  root.addEventListener("click",function(e){
    if(longPressTriggered){ longPressTriggered=false; e.preventDefault(); return; }
    if(e.target.closest('[contenteditable="true"]')) return;
    const b=e.target.closest("[data-action]"); if(!b)return;
    const a=b.dataset.action;
    if(a==="new-folder")newFolder();
    if(a==="home")home();
    if(a==="folder")folderPage();
    if(a==="new-list")newList();
    if(a==="open-folder"){currentFolder=b.dataset.id;folderPage();}
    if(a==="open-list"){currentList=b.dataset.id;listPage();}
    if(a==="add-row")addRow();
    if(a==="rename-folder"){
      const f=getFolder(),n=prompt("Nuevo nombre:",f.name);
      if(n&&n.trim()){f.name=n.trim();save();folderPage();}
    }
    if(a==="delete-folder"&&confirm("¿Eliminar esta carpeta y todas sus listas?")){
      data.folders=data.folders.filter(f=>f.id!==currentFolder);save();home();
    }
    if(a==="rename-list"){
      const l=getList(),n=prompt("Nuevo nombre:",l.name);
      if(n&&n.trim()){l.name=n.trim();save();listPage();}
    }
    if(a==="delete-list"&&confirm("¿Eliminar esta lista?")){
      const f=getFolder();f.lists=f.lists.filter(l=>l.id!==currentList);save();folderPage();
    }
  });

  // Edición directa dentro de las celdas, sin inputs ni ventanas emergentes.
  root.addEventListener("input",function(e){
    const el=e.target.closest('[contenteditable="true"][data-edit]');
    if(!el) return;
    const l=getList(); if(!l) return;
    const value=el.innerText.replace(/[\n\r]/g,"");
    const kind=el.dataset.edit, index=Number(el.dataset.index), col=Number(el.dataset.col);
    if(kind==="name" && l.rows[index]) l.rows[index].name=value;
    if(kind==="value" && l.rows[index]) l.rows[index].values[col]=value;
    if(kind==="column" && col>=0 && col<l.columns.length) l.columns[col]=value;
    save();
  });

  root.addEventListener("blur",function(e){
    const el=e.target.closest?.('[contenteditable="true"][data-edit]');
    if(!el) return;
    const l=getList(); if(!l) return;
    const value=el.innerText.replace(/[\n\r]/g,"").trim();
    const kind=el.dataset.edit, index=Number(el.dataset.index), col=Number(el.dataset.col);
    if(kind==="name" && l.rows[index]) l.rows[index].name=value;
    if(kind==="value" && l.rows[index]) l.rows[index].values[col]=value;
    if(kind==="column" && col>=0 && col<l.columns.length) l.columns[col]=value;
    el.textContent=value;
    save();
  },true);

  root.addEventListener("keydown",function(e){
    const el=e.target.closest?.('[contenteditable="true"][data-edit]');
    if(!el) return;
    if(e.key==="Enter"){ e.preventDefault(); el.blur(); }
    if(e.key==="Escape"){
      e.preventDefault();
      const l=getList(); if(!l) return;
      const kind=el.dataset.edit, index=Number(el.dataset.index), col=Number(el.dataset.col);
      if(kind==="name" && l.rows[index]) el.textContent=l.rows[index].name;
      if(kind==="value" && l.rows[index]) el.textContent=l.rows[index].values[col]??"";
      if(kind==="column" && l.columns[col]!==undefined) el.textContent=l.columns[col];
      el.blur();
    }
  });

  root.addEventListener("change",function(e){
    const el=e.target;
    if(el.dataset.action==="check"){
      const l=getList(),i=Number(el.dataset.index);
      if(l&&l.rows[i]){l.rows[i].done=el.checked;save();listPage();}
    }
  });

  // Pulsación prolongada sobre cualquier zona de una fila.
  root.addEventListener("pointerdown",function(e){
    const tr=e.target.closest("tbody tr[data-row]");
    if(!tr || e.target.closest("input,button"))return;
    longPressTriggered=false;
    activeRow=Number(tr.dataset.row);
    tr.classList.add("long-pressing");
    clearTimeout(longPressTimer);
    longPressTimer=setTimeout(()=>{
      longPressTriggered=true;
      if(navigator.vibrate) navigator.vibrate(25);
      showDeleteModal(activeRow);
    },600);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(type=>{
    root.addEventListener(type,()=>{
      clearTimeout(longPressTimer);
      root.querySelectorAll("tr.long-pressing").forEach(row=>row.classList.remove("long-pressing"));
    });
  });
  root.addEventListener("contextmenu",e=>{
    if(e.target.closest("tbody tr[data-row]"))e.preventDefault();
  });

  home();
})();
</script>
</body>
</html>
